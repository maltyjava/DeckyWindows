name: Build Decky for Windows

# Upstream builds Windows binaries in CI but never attaches them to releases - only the
# Linux "PluginLoader" is published. That is also why Decky's in-app updater cannot work
# on Windows: updater.py looks for an asset named exactly "PluginLoader.exe".
#
# This builds the missing Windows binaries for BOTH channels - newest stable and newest
# prerelease - and publishes each as its own release tagged decky-<version>, together with
# install_decky.exe. Prereleases matter on Windows for the same reason they do on Linux:
# when a Steam client update breaks the UI, the fix usually lands in a prerelease first.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Build this exact Decky tag (blank = newest of each channel)'
        required: false
        type: string
      force:
        description: 'Rebuild even if a release for that version already exists'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'   # daily, to pick up new Decky releases

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      # Serialised: both legs can resolve to the same tag, and parallel runs would race
      # to create the same release.
      max-parallel: 1
      matrix:
        channel: [stable, prerelease]

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Resolve target and decide whether to build
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channel  = '${{ matrix.channel }}'
          $explicit = '${{ inputs.ref }}'
          $force    = '${{ inputs.force }}' -eq 'true'
          $headers  = @{ 'User-Agent' = 'DeckyWindows-CI' }
          $api      = 'https://api.github.com/repos/SteamDeckHomebrew/decky-loader/releases'

          function BaseVersion([string]$tag) {
            # v3.2.10-pre1 -> 3.2.10 ; so 3.2.10-pre1 sorts above stable 3.2.9
            $v = $tag.TrimStart('v') -replace '-(pre|rc|beta|alpha).*$', ''
            try { return [version]$v } catch { return [version]'0.0.0' }
          }

          $skip   = $false
          $ref    = ''
          $reason = ''

          if (-not [string]::IsNullOrWhiteSpace($explicit)) {
            # An explicit tag is a single build - run it on the stable leg only.
            if ($channel -ne 'stable') { $skip = $true; $reason = 'explicit ref builds once' }
            $ref = $explicit
          }
          elseif ($channel -eq 'stable') {
            $ref = (Invoke-RestMethod "$api/latest" -Headers $headers).tag_name
          }
          else {
            $all = Invoke-RestMethod "$api`?per_page=30" -Headers $headers
            $pre = $all | Where-Object { $_.prerelease } | Select-Object -First 1
            if (-not $pre) {
              $skip = $true; $reason = 'no prerelease published'
            } else {
              $ref = $pre.tag_name
              $latestStable = (Invoke-RestMethod "$api/latest" -Headers $headers).tag_name
              # Only worth building a prerelease that is actually ahead of stable.
              if ((BaseVersion $ref) -le (BaseVersion $latestStable)) {
                $skip = $true
                $reason = "prerelease $ref is not ahead of stable $latestStable"
              }
            }
          }

          if (-not $skip) {
            if ($ref -match '^[0-9]') { $ref = "v$ref" }
            $tag = "decky-$ref"
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            # A missing release is the normal case and exits non-zero. Capture it, then
            # clear $LASTEXITCODE: pwsh propagates it as the step's exit code otherwise,
            # failing the step even though nothing went wrong.
            $alreadyPublished = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($alreadyPublished -and -not $force) {
              $skip = $true; $reason = "$tag already published"
            }
            "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          }

          "ref=$ref"   | Out-File $env:GITHUB_OUTPUT -Append
          "skip=$skip" | Out-File $env:GITHUB_OUTPUT -Append
          "pre=$($channel -eq 'prerelease')" | Out-File $env:GITHUB_OUTPUT -Append

          if ($skip) { Write-Host "[$channel] skipping - $reason" }
          else       { Write-Host "[$channel] building $ref" }

          exit 0

      - name: Checkout decky-loader
        if: steps.plan.outputs.skip != 'True'
        uses: actions/checkout@v4
        with:
          repository: SteamDeckHomebrew/decky-loader
          ref: ${{ steps.plan.outputs.ref }}
          path: decky

      - name: Set up NodeJS 20
        if: steps.plan.outputs.skip != 'True'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11.7
        if: steps.plan.outputs.skip != 'True'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'

      - name: Install Poetry
        if: steps.plan.outputs.skip != 'True'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: false

      - name: Locate Poetry and put it on PATH
        if: steps.plan.outputs.skip != 'True'
        shell: pwsh
        run: |
          # snok/install-poetry does not leave poetry on PATH for later steps on Windows.
          # Upstream's build-win.yml hardcodes the runneradmin path; resolve it instead so
          # this does not depend on the runner's username.
          $candidates = @(
            (Join-Path $env:USERPROFILE '.local\bin\poetry.exe'),
            (Join-Path $env:USERPROFILE '.local\bin\poetry'),
            (Join-Path $env:APPDATA   'Python\Scripts\poetry.exe')
          )
          $p = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $p) {
            $g = Get-Command poetry -ErrorAction SilentlyContinue
            if ($g) { $p = $g.Source }
          }
          if (-not $p) { throw "poetry not found after install. Looked in: $($candidates -join '; ')" }
          Write-Host "poetry: $p"
          (Split-Path $p -Parent) | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Python dependencies
        if: steps.plan.outputs.skip != 'True'
        working-directory: ./decky/backend
        run: |
          poetry self add "poetry-dynamic-versioning[plugin]"
          poetry install --no-interaction

      - name: Install JS dependencies
        if: steps.plan.outputs.skip != 'True'
        working-directory: ./decky/frontend
        run: |
          npm i -g pnpm
          pnpm i --frozen-lockfile

      - name: Build frontend
        if: steps.plan.outputs.skip != 'True'
        working-directory: ./decky/frontend
        run: pnpm run build

      - name: Build backend
        if: steps.plan.outputs.skip != 'True'
        working-directory: ./decky/backend
        run: |
          poetry dynamic-versioning
          poetry run pyinstaller pyinstaller.spec

      - name: Build backend (noconsole)
        if: steps.plan.outputs.skip != 'True'
        working-directory: ./decky/backend
        shell: pwsh
        run: |
          $env:DECKY_NOCONSOLE = 1
          poetry run pyinstaller pyinstaller.spec

      - name: Compile install_decky.exe
        if: steps.plan.outputs.skip != 'True'
        shell: pwsh
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe
          Invoke-PS2EXE -InputFile  './install-decky.ps1' `
                        -OutputFile './install_decky.exe' `
                        -title 'Decky Loader Installer' `
                        -description 'Installs Decky Loader on Windows' `
                        -company 'DeckyWindows' -product 'Decky Loader Installer' `
                        -version '1.0.0' -requireAdmin

      - name: Verify artifacts
        if: steps.plan.outputs.skip != 'True'
        shell: pwsh
        run: |
          foreach ($f in @(
            './decky/backend/dist/PluginLoader.exe',
            './decky/backend/dist/PluginLoader_noconsole.exe',
            './install_decky.exe')) {
            if (-not (Test-Path $f)) { throw "missing artifact: $f" }
            '{0,-52} {1,8:N1} MB' -f $f, ((Get-Item $f).Length / 1MB)
          }

      - name: Publish release
        if: steps.plan.outputs.skip != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.plan.outputs.tag }}'
          $ref = '${{ steps.plan.outputs.ref }}'
          $pre = '${{ steps.plan.outputs.pre }}' -eq 'True'
          $channelName = if ($pre) { 'prerelease' } else { 'stable' }

          # Notes live in a template file. A PowerShell here-string cannot be used here:
          # its body must start at column 0, which would break out of this YAML block
          # scalar and make the whole workflow fail to parse.
          $notes = (Get-Content '.github/release-notes-template.md' -Raw).
                     Replace('{{REF}}', $ref).
                     Replace('{{CHANNEL}}', $channelName)
          Set-Content -Path 'release-notes.md' -Value $notes -Encoding utf8

          $ghArgs = @(
            $tag,
            './decky/backend/dist/PluginLoader.exe',
            './decky/backend/dist/PluginLoader_noconsole.exe',
            './install_decky.exe',
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', "Decky Loader $ref (Windows, $channelName)",
            '--notes-file', 'release-notes.md'
          )
          if ($pre) { $ghArgs += '--prerelease' }
          gh release create @ghArgs
